<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#0c172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg-grad)"/>

  <!-- Construction Structural Wireframe -->
  <g transform="translate(300, 240)">
    <rect x="-100" y="-120" width="200" height="200" fill="rgba(0,102,255,0.08)" stroke="#0066ff" stroke-width="2"/>
    <line x1="-100" y1="-120" x2="100" y2="80" stroke="#0066ff" stroke-width="1.5" opacity="0.4"/>
    <line x1="100" y1="-120" x2="-100" y2="80" stroke="#0066ff" stroke-width="1.5" opacity="0.4"/>
  </g>

  <g transform="translate(560, 210)">
    <rect x="-80" y="-150" width="160" height="230" fill="rgba(34,197,94,0.08)" stroke="#22c55e" stroke-width="2"/>
  </g>

  <rect x="40" y="30" width="310" height="50" rx="6" fill="rgba(5, 8, 17, 0.85)" stroke="#0066ff" stroke-width="1"/>
  <text x="55" y="60" fill="#22c55e" font-family="sans-serif" font-size="16" font-weight="bold">CONSTRUCTION &amp; INFRASTRUCTURE</text>
</svg>
