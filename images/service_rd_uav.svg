<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#0b172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066ff"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg-grad)"/>

  <!-- Futuristic UAV Schematic Wireframe Lines -->
  <g transform="translate(400, 220)">
    <!-- Outer Flight Chassis Blueprint -->
    <path d="M0,-140 L160,-40 L120,80 L0,120 L-120,80 L-160,-40 Z" fill="rgba(0,102,255,0.06)" stroke="#0066ff" stroke-width="1.5" stroke-dasharray="6,4"/>
    <circle cx="0" cy="0" r="100" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="8,4"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#0066ff" stroke-width="1"/>
    
    <!-- Central Payload Drone Unit -->
    <rect x="-45" y="-20" width="90" height="40" rx="10" fill="url(#brand-grad)" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="10" fill="#050811" stroke="#22c55e" stroke-width="2"/>
  </g>

  <!-- Telemetry HUD Header -->
  <rect x="40" y="30" width="280" height="65" rx="6" fill="rgba(5, 8, 17, 0.85)" stroke="#22c55e" stroke-width="1"/>
  <text x="55" y="52" fill="#22c55e" font-family="monospace" font-size="12" font-weight="bold">CUSTOM UAV RESEARCH &amp; DEVELOPMENT</text>
  <text x="55" y="72" fill="#0066ff" font-family="monospace" font-size="11">AUTONOMOUS FLIGHT CONTROLLER</text>
  <text x="55" y="86" fill="#ffffff" font-family="monospace" font-size="10">HARDWARE &amp; SENSOR INTEGRATION</text>
</svg>
