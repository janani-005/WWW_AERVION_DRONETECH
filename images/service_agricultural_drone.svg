<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040810"/>
      <stop offset="50%" stop-color="#0c1d18"/>
      <stop offset="100%" stop-color="#050912"/>
    </linearGradient>
    <linearGradient id="crop-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="ndvi-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#eab308" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0066ff" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg-grad)"/>

  <!-- Field Crop Perspective Grid -->
  <g transform="translate(400, 320) rotate(-10)">
    <path d="M-360,-60 L360,-60 L450,120 L-450,120 Z" fill="url(#ndvi-grad)" opacity="0.4"/>
    <!-- Crop Row Lines -->
    <line x1="-360" y1="-60" x2="-450" y2="120" stroke="#22c55e" stroke-width="2"/>
    <line x1="-240" y1="-60" x2="-300" y2="120" stroke="#22c55e" stroke-width="2"/>
    <line x1="-120" y1="-60" x2="-150" y2="120" stroke="#22c55e" stroke-width="2"/>
    <line x1="0" y1="-60" x2="0" y2="120" stroke="#22c55e" stroke-width="2"/>
    <line x1="120" y1="-60" x2="150" y2="120" stroke="#22c55e" stroke-width="2"/>
    <line x1="240" y1="-60" x2="300" y2="120" stroke="#22c55e" stroke-width="2"/>
    <line x1="360" y1="-60" x2="450" y2="120" stroke="#22c55e" stroke-width="2"/>
  </g>

  <!-- Precision Spraying / NDVI Scan Mist -->
  <polygon points="390,120 180,310 600,310" fill="url(#ndvi-grad)" opacity="0.25"/>

  <!-- Agri Spraying / Scanning Octocopter Drone -->
  <g transform="translate(390, 110)">
    <rect x="-40" y="-14" width="80" height="28" rx="8" fill="#10b981" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="8" fill="#040810"/>

    <line x1="-40" y1="-8" x2="-90" y2="-40" stroke="#22c55e" stroke-width="3.5"/>
    <line x1="40" y1="-8" x2="90" y2="-40" stroke="#22c55e" stroke-width="3.5"/>
    <line x1="-40" y1="8" x2="-90" y2="40" stroke="#0066ff" stroke-width="3.5"/>
    <line x1="40" y1="8" x2="90" y2="40" stroke="#0066ff" stroke-width="3.5"/>

    <ellipse cx="-90" cy="-40" rx="32" ry="6" fill="none" stroke="#22c55e" stroke-width="2"/>
    <ellipse cx="90" cy="-40" rx="32" ry="6" fill="none" stroke="#22c55e" stroke-width="2"/>
    <ellipse cx="-90" cy="40" rx="32" ry="6" fill="none" stroke="#0066ff" stroke-width="2"/>
    <ellipse cx="90" cy="40" rx="32" ry="6" fill="none" stroke="#0066ff" stroke-width="2"/>
  </g>

  <!-- Telemetry HUD -->
  <rect x="40" y="30" width="270" height="65" rx="6" fill="rgba(4, 8, 16, 0.85)" stroke="#10b981" stroke-width="1"/>
  <text x="55" y="52" fill="#22c55e" font-family="monospace" font-size="12" font-weight="bold">PRECISION AGRICULTURE & NDVI</text>
  <text x="55" y="72" fill="#10b981" font-family="monospace" font-size="11">CROP HEALTH INDEX: 0.84 (OPTIMAL)</text>
  <text x="55" y="86" fill="#0066ff" font-family="monospace" font-size="10">SPRAYING COVERAGE: 12.5 HECTARES/HR</text>
</svg>
