<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#0b172a"/>
      <stop offset="100%" stop-color="#04070e"/>
    </linearGradient>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066ff"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg-grad)"/>

  <!-- Energy Background Visual: Solar Panels & Wind Turbine -->
  <g transform="translate(250, 280) rotate(12)">
    <polygon points="-180,-40 -20,-40 20,40 -140,40" fill="#0052d4" stroke="#0066ff" stroke-width="1.5" opacity="0.8"/>
    <polygon points="30,-40 190,-40 230,40 70,40" fill="#0052d4" stroke="#0066ff" stroke-width="1.5" opacity="0.8"/>
  </g>

  <g transform="translate(620, 230)">
    <polygon points="-8,150 8,150 4,-60 -4,-60" fill="#1e293b" stroke="#0066ff" stroke-width="1.5"/>
    <circle cx="0" cy="-60" r="10" fill="#22c55e"/>
    <path d="M0,-60 Q20,-150 5,-170 Q-10,-150 0,-60" fill="#22c55e"/>
    <path d="M0,-60 Q90,0 110,15 Q80,25 0,-60" fill="#0066ff"/>
    <path d="M0,-60 Q-90,15 -110,25 Q-80,30 0,-60" fill="#0066ff"/>
  </g>

  <!-- Title Badge -->
  <rect x="40" y="30" width="220" height="50" rx="6" fill="rgba(5, 8, 17, 0.85)" stroke="#22c55e" stroke-width="1"/>
  <text x="55" y="60" fill="#22c55e" font-family="sans-serif" font-size="16" font-weight="bold">ENERGY &amp; UTILITIES</text>
</svg>
