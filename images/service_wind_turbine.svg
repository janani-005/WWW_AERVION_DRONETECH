<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060b14"/>
      <stop offset="50%" stop-color="#0b172a"/>
      <stop offset="100%" stop-color="#04070e"/>
    </linearGradient>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066ff"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg-grad)"/>

  <!-- Wind Turbine Vector -->
  <g transform="translate(520, 260)">
    <!-- Tower Base -->
    <polygon points="-12,180 12,180 6,-80 -6,-80" fill="#1e293b" stroke="#0066ff" stroke-width="1.5"/>
    <!-- Nacelle Hub -->
    <ellipse cx="0" cy="-80" rx="14" ry="10" fill="#0066ff" filter="url(#glow)"/>
    <!-- Blades -->
    <path d="M0,-80 Q30,-200 10,-220 Q-10,-200 0,-80" fill="#22c55e" opacity="0.9"/>
    <path d="M0,-80 Q130,0 150,20 Q120,30 0,-80" fill="#0066ff" opacity="0.8"/>
    <path d="M0,-80 Q-130,20 -150,35 Q-120,40 0,-80" fill="#0066ff" opacity="0.8"/>
  </g>

  <!-- Inspection Target Highlight on Blade -->
  <circle cx="530" cy="140" r="22" fill="none" stroke="#22c55e" stroke-width="2" stroke-dasharray="4,4" filter="url(#glow)"/>
  <circle cx="530" cy="140" r="4" fill="#22c55e"/>
  <line x1="530" y1="110" x2="530" y2="170" stroke="#22c55e" stroke-width="1"/>
  <line x1="500" y1="140" x2="560" y2="140" stroke="#22c55e" stroke-width="1"/>

  <!-- Drone Positioned Scanning Blade -->
  <g transform="translate(320, 140)">
    <!-- Laser Beam -->
    <line x1="20" y1="0" x2="190" y2="0" stroke="#22c55e" stroke-width="2" stroke-dasharray="6,3" filter="url(#glow)"/>
    <polygon points="20,0 210,-25 210,25" fill="#22c55e" opacity="0.15"/>

    <rect x="-30" y="-12" width="60" height="24" rx="6" fill="url(#brand-grad)"/>
    <circle cx="0" cy="0" r="6" fill="#060b14"/>

    <line x1="-30" y1="-8" x2="-65" y2="-32" stroke="#0066ff" stroke-width="3"/>
    <line x1="30" y1="-8" x2="65" y2="-32" stroke="#0066ff" stroke-width="3"/>
    <line x1="-30" y1="8" x2="-65" y2="32" stroke="#0066ff" stroke-width="3"/>
    <line x1="30" y1="8" x2="65" y2="32" stroke="#0066ff" stroke-width="3"/>

    <ellipse cx="-65" cy="-32" rx="25" ry="5" fill="none" stroke="#22c55e" stroke-width="2"/>
    <ellipse cx="65" cy="-32" rx="25" ry="5" fill="none" stroke="#22c55e" stroke-width="2"/>
    <ellipse cx="-65" cy="32" rx="25" ry="5" fill="none" stroke="#22c55e" stroke-width="2"/>
    <ellipse cx="65" cy="32" rx="25" ry="5" fill="none" stroke="#22c55e" stroke-width="2"/>
  </g>

  <!-- Telemetry HUD -->
  <rect x="40" y="30" width="250" height="65" rx="6" fill="rgba(6, 11, 20, 0.85)" stroke="#0066ff" stroke-width="1"/>
  <text x="55" y="52" fill="#22c55e" font-family="monospace" font-size="12" font-weight="bold">WIND TURBINE BLADE INSPECTION</text>
  <text x="55" y="72" fill="#0066ff" font-family="monospace" font-size="11">SCAN MODE: 4K HIGH RES RGB + NDT</text>
  <text x="55" y="86" fill="#ffffff" font-family="monospace" font-size="10">SAFETY: NO ROPE ACCESS REQUIRED</text>
</svg>
