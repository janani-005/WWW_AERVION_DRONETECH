<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#0b162c"/>
      <stop offset="100%" stop-color="#060b14"/>
    </linearGradient>
    <linearGradient id="solar-panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052d4"/>
      <stop offset="100%" stop-color="#0d254f"/>
    </linearGradient>
    <linearGradient id="thermal-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#eab308" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066ff"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg-grad)"/>

  <!-- Solar Farm Perspective Panels Grid -->
  <g transform="translate(400, 260) rotate(15)">
    <!-- Panel Row 1 -->
    <polygon points="-320,-80 -60,-80 -20,10 -280,10" fill="url(#solar-panel)" stroke="#0066ff" stroke-width="1.5"/>
    <polygon points="20,-80 280,-80 320,10 60,10" fill="url(#solar-panel)" stroke="#0066ff" stroke-width="1.5"/>

    <!-- Panel Row 2 -->
    <polygon points="-350,30 -10,30 30,130 -310,130" fill="url(#solar-panel)" stroke="#0066ff" stroke-width="1.5"/>
    <polygon points="50,30 390,30 430,130 90,130" fill="url(#solar-panel)" stroke="#0066ff" stroke-width="1.5"/>

    <!-- Thermal Hotspot Defect Highlight -->
    <ellipse cx="-120" cy="70" rx="35" ry="20" fill="url(#thermal-gradient)" filter="url(#glow)"/>
    <circle cx="-120" cy="70" r="8" fill="#ef4444" filter="url(#glow)"/>
    <line x1="-120" y1="20" x2="-120" y2="120" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="-170" y1="70" x2="-70" y2="70" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,3"/>
  </g>

  <!-- Thermal Scan Beam Cone -->
  <polygon points="400,90 200,340 360,340" fill="url(#thermal-gradient)"/>

  <!-- Inspection Drone -->
  <g transform="translate(400, 90)">
    <rect x="-30" y="-10" width="60" height="20" rx="6" fill="url(#brand-grad)" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="6" fill="#ffffff"/>
    <line x1="-30" y1="0" x2="-70" y2="-30" stroke="#22c55e" stroke-width="3"/>
    <line x1="30" y1="0" x2="70" y2="-30" stroke="#22c55e" stroke-width="3"/>
    <line x1="-30" y1="0" x2="-70" y2="30" stroke="#0066ff" stroke-width="3"/>
    <line x1="30" y1="0" x2="70" y2="30" stroke="#0066ff" stroke-width="3"/>

    <ellipse cx="-70" cy="-30" rx="28" ry="5" fill="none" stroke="#22c55e" stroke-width="2"/>
    <ellipse cx="70" cy="-30" rx="28" ry="5" fill="none" stroke="#22c55e" stroke-width="2"/>
    <ellipse cx="-70" cy="30" rx="28" ry="5" fill="none" stroke="#0066ff" stroke-width="2"/>
    <ellipse cx="70" cy="30" rx="28" ry="5" fill="none" stroke="#0066ff" stroke-width="2"/>
  </g>

  <!-- Telemetry Box -->
  <rect x="40" y="30" width="240" height="65" rx="6" fill="rgba(6, 11, 20, 0.8)" stroke="#22c55e" stroke-width="1"/>
  <text x="55" y="52" fill="#22c55e" font-family="monospace" font-size="12" font-weight="bold">SOLAR THERMAL INSPECTION</text>
  <text x="55" y="72" fill="#ef4444" font-family="monospace" font-size="11">DEFECT: THERMAL HOTSPOT (48°C)</text>
  <text x="55" y="86" fill="#0066ff" font-family="monospace" font-size="10">EFFICIENCY GAIN: +18.4%</text>
</svg>
