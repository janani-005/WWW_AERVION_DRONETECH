    <line x1="-380" y1="-60" x2="-450" y2="110" stroke="#22c55e" stroke-width="2"/>
    <line x1="-190" y1="-60" x2="-225" y2="110" stroke="#22c55e" stroke-width="2"/>
    <line x1="0" y1="-60" x2="0" y2="110" stroke="#22c55e" stroke-width="2"/>
    <line x1="190" y1="-60" x2="225" y2="110" stroke="#22c55e" stroke-width="2"/>
    <line x1="380" y1="-60" x2="450" y2="110" stroke="#22c55e" stroke-width="2"/>
  </g>

  <rect x="40" y="30" width="250" height="50" rx="6" fill="rgba(4, 8, 16, 0.85)" stroke="#10b981" stroke-width="1"/>
  <text x="55" y="60" fill="#22c55e" font-family="sans-serif" font-size="16" font-weight="bold">PRECISION AGRICULTURE</text>
