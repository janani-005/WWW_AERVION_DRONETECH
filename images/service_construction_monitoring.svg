<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#0c172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066ff"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg-grad)"/>

  <!-- Construction Structural Wireframe Towers -->
  <g transform="translate(180, 180)">
    <rect x="-60" y="-80" width="120" height="220" fill="rgba(0,102,255,0.1)" stroke="#0066ff" stroke-width="1.5"/>
    <line x1="-60" y1="-80" x2="60" y2="140" stroke="#0066ff" stroke-width="1" opacity="0.4"/>
    <line x1="60" y1="-80" x2="-60" y2="140" stroke="#0066ff" stroke-width="1" opacity="0.4"/>
    <line x1="-60" y1="-10" x2="60" y2="-10" stroke="#0066ff" stroke-width="1" opacity="0.4"/>
    <line x1="-60" y1="60" x2="60" y2="60" stroke="#0066ff" stroke-width="1" opacity="0.4"/>
  </g>

  <g transform="translate(560, 210)">
    <rect x="-80" y="-120" width="160" height="220" fill="rgba(34,197,94,0.08)" stroke="#22c55e" stroke-width="1.5"/>
    <line x1="-80" y1="-120" x2="80" y2="100" stroke="#22c55e" stroke-width="1" opacity="0.4"/>
    <line x1="80" y1="-120" x2="-80" y2="100" stroke="#22c55e" stroke-width="1" opacity="0.4"/>
    <!-- Progress Indicator HUD -->
    <rect x="-60" y="-90" width="120" height="15" fill="none" stroke="#22c55e" stroke-width="1"/>
    <rect x="-58" y="-88" width="85" height="11" fill="#22c55e" opacity="0.8"/>
  </g>

  <!-- Volumetric Earthwork Mesh Grid -->
  <path d="M 50,400 Q 250,320 400,380 T 750,350" fill="none" stroke="#0066ff" stroke-width="2" opacity="0.5"/>
  <path d="M 50,380 Q 270,300 420,360 T 750,330" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.7"/>

  <!-- Construction Survey Drone -->
  <g transform="translate(380, 110)">
    <!-- Site Scanner Cone -->
    <polygon points="0,20 -150,260 150,260" fill="url(#brand-grad)" opacity="0.12"/>

    <rect x="-32" y="-12" width="64" height="24" rx="6" fill="url(#brand-grad)"/>
    <circle cx="0" cy="0" r="6" fill="#050811"/>

    <line x1="-32" y1="-6" x2="-70" y2="-30" stroke="#22c55e" stroke-width="3"/>
    <line x1="32" y1="-6" x2="70" y2="-30" stroke="#22c55e" stroke-width="3"/>
    <line x1="-32" y1="6" x2="-70" y2="30" stroke="#0066ff" stroke-width="3"/>
    <line x1="32" y1="6" x2="70" y2="30" stroke="#0066ff" stroke-width="3"/>

    <ellipse cx="-70" cy="-30" rx="26" ry="5" fill="none" stroke="#22c55e" stroke-width="2"/>
    <ellipse cx="70" cy="-30" rx="26" ry="5" fill="none" stroke="#22c55e" stroke-width="2"/>
    <ellipse cx="-70" cy="30" rx="26" ry="5" fill="none" stroke="#0066ff" stroke-width="2"/>
    <ellipse cx="70" cy="30" rx="26" ry="5" fill="none" stroke="#0066ff" stroke-width="2"/>
  </g>

  <!-- Telemetry HUD -->
  <rect x="40" y="30" width="260" height="65" rx="6" fill="rgba(6, 11, 20, 0.85)" stroke="#22c55e" stroke-width="1"/>
  <text x="55" y="52" fill="#22c55e" font-family="monospace" font-size="12" font-weight="bold">CONSTRUCTION PROGRESS MONITORING</text>
  <text x="55" y="72" fill="#0066ff" font-family="monospace" font-size="11">VOLUMETRIC ANALYSIS: EARTHWORK CALC</text>
  <text x="55" y="86" fill="#ffffff" font-family="monospace" font-size="10">BUILDING PHASE: 68% COMPLETE</text>
</svg>
