<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#0b172a"/>
      <stop offset="100%" stop-color="#04070e"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg-grad)"/>

  <!-- Industrial Facility Grid -->
  <g transform="translate(400, 240)">
    <rect x="-180" y="-100" width="140" height="180" fill="rgba(0,102,255,0.1)" stroke="#0066ff" stroke-width="2"/>
    <rect x="-20" y="-140" width="180" height="220" fill="rgba(34,197,94,0.08)" stroke="#22c55e" stroke-width="2"/>
  </g>

  <rect x="40" y="30" width="280" height="50" rx="6" fill="rgba(5, 8, 17, 0.85)" stroke="#0066ff" stroke-width="1"/>
  <text x="55" y="60" fill="#22c55e" font-family="sans-serif" font-size="16" font-weight="bold">INDUSTRIAL &amp; SMART CITIES</text>
</svg>
