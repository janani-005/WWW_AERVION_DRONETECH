server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: aervion-contact-backend

  # Spring Mail configuration for Custom Domain / Gmail SMTP Server
  mail:
    host: ${SPRING_MAIL_HOST:smtpout.secureserver.net}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:Info@aerviondronetechsolutions.in}
    password: ${SPRING_MAIL_PASSWORD:xxxxxxxxxx}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_STARTTLS:true}
            required: ${SPRING_MAIL_STARTTLS_REQUIRED:true}
          ssl:
            trust: ${SPRING_MAIL_SSL_TRUST:*}
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

# Custom application properties for Aervion DroneTech
aervion:
  mail:
    from-address: ${AERVION_MAIL_FROM:Info@aerviondronetechsolutions.in}
    to-address: ${AERVION_MAIL_TO:Info@aerviondronetechsolutions.in}
    sender-name: ${AERVION_SENDER_NAME:Aervion DroneTech Web Portal}
    send-auto-acknowledgment: ${AERVION_AUTO_ACK:true}

# CORS Configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://localhost:8080,http://127.0.0.1:8080,https://aerviondronetechsolutions.in,https://www.aerviondronetechsolutions.in}
